project: Meeting scheduler
overview: |
  A tool that helps find time for meetings. Given the events already on
  someone's calendar for a day, it works out when they're busy, when they're
  free, and whether a proposed new meeting would clash with anything. All
  times are simple "HH:MM" 24-hour strings within a single day, so "09:00"
  comes before "13:30". A person is busy from an event's start up to (but not
  including) its end -- so an event 09:00-10:00 and another 10:00-11:00 do NOT
  overlap; they just touch.

context_blocks:
  touching_rule: |
    Events that only touch at the edges do NOT count as overlapping.
    09:00-10:00 and 10:00-11:00 are fine. They overlap only if one starts
    strictly before the other ends: 09:00-10:30 and 10:00-11:00 overlap.
  slot_rule: |
    A free slot is a gap between busy blocks, from the end of one block to
    the start of the next. Also count the time before the first event
    (from the day's start) and after the last event (to the day's end).

nouns:
  event:
    title: text
    start: text      # "HH:MM"
    end: text        # "HH:MM"

  slot:
    start: text      # "HH:MM"
    end: text        # "HH:MM"

functions:
  - name: sort_events
    does: Sort a day's events by their start time, earliest first
    context: overview
    input:
      events: list of event
    output: list of event
    examples:
      - given:
          events:
            - { title: Lunch, start: "12:00", end: "13:00" }
            - { title: Standup, start: "09:00", end: "09:15" }
            - { title: Review, start: "15:00", end: "16:00" }
        returns:
          - { title: Standup, start: "09:00", end: "09:15" }
          - { title: Lunch, start: "12:00", end: "13:00" }
          - { title: Review, start: "15:00", end: "16:00" }
      # edge case: already sorted, single element
      - given:
          events:
            - { title: Only, start: "10:00", end: "11:00" }
        returns:
          - { title: Only, start: "10:00", end: "11:00" }

  - name: has_overlap
    does: >
      Return yes if any two events in the list overlap in time. Events that
      only touch at the edges (one ends exactly when the next starts) do NOT
      count as overlapping.
    context: touching_rule
    input:
      events: list of event
    output: yes/no
    examples:
      # clear overlap
      - given:
          events:
            - { title: A, start: "09:00", end: "10:30" }
            - { title: B, start: "10:00", end: "11:00" }
        returns: yes
      # edge case: exactly touching -> NOT an overlap
      - given:
          events:
            - { title: A, start: "09:00", end: "10:00" }
            - { title: B, start: "10:00", end: "11:00" }
        returns: no
      # edge case: no events at all
      - given:
          events: []
        returns: no
      # edge case: one fully inside another
      - given:
          events:
            - { title: Big, start: "09:00", end: "17:00" }
            - { title: Small, start: "12:00", end: "13:00" }
        returns: yes

  - name: free_slots
    does: >
      Given a day's events and the day's start and end times, return the free
      gaps: before the first event, between events, and after the last event.
      Assume the events do not overlap and are not necessarily sorted.
    context: slot_rule
    input:
      events: list of event
      day_start: text
      day_end: text
    output: list of slot
    examples:
      # gaps before, between, and after
      - given:
          events:
            - { title: Standup, start: "09:00", end: "09:30" }
            - { title: Review, start: "14:00", end: "15:00" }
          day_start: "08:00"
          day_end: "17:00"
        returns:
          - { start: "08:00", end: "09:00" }
          - { start: "09:30", end: "14:00" }
          - { start: "15:00", end: "17:00" }
      # edge case: no events -> the whole day is one free slot
      - given:
          events: []
          day_start: "08:00"
          day_end: "17:00"
        returns:
          - { start: "08:00", end: "17:00" }
      # edge case: an event flush against the day start -> no leading slot
      - given:
          events:
            - { title: Early, start: "08:00", end: "09:00" }
          day_start: "08:00"
          day_end: "10:00"
        returns:
          - { start: "09:00", end: "10:00" }

  - name: fits_in_slot
    does: >
      Given a free slot and a meeting length in minutes, return yes if a
      meeting of that length fits inside the slot.
    context: overview
    input:
      slot: a slot
      minutes: whole number
    output: yes/no
    examples:
      # 90-minute slot, 60-minute meeting -> fits
      - given:
          slot: { start: "09:00", end: "10:30" }
          minutes: 60
        returns: yes
      # edge case: meeting exactly fills the slot -> fits
      - given:
          slot: { start: "09:00", end: "10:00" }
          minutes: 60
        returns: yes
      # edge case: meeting one minute too long -> does not fit
      - given:
          slot: { start: "09:00", end: "10:00" }
          minutes: 61
        returns: no

main:
  - sort_events
  - free_slots
