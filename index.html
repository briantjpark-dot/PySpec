<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>SpecForge</title>
</head>

<body>

    <h1>SpecForge</h1>

    <div id="toolbar">
        <button id="build-btn">Build</button>
    </div>

    <div id="error-banner"></div>

    <div id="editor-region">
        <p>Specification (YAML)</p>
        <textarea id="spec-input" rows="20" cols="60"></textarea>
    </div>

    <div id="output-region">
        <p>Generated files</p>
        <div id="tabs"></div>
        <pre id="output-code"></pre>
    </div>

    <script src="app.js"></script>

</body>

</html>
