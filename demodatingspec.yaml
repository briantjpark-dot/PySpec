project: 5CDating
overview: |
  A dating app for the Claremont Colleges that scores compatibility 
  across the 5Cs and lenas into cross-campus matches

nouns:
  profile:
    name: text
    college: text
    class_year: whole number
    major: text
    interests: list of text
    open_to_all_campuses: yes/no

functions:
  - name: shared_interests
    does: Return the interests two students have in common.
    input:
      me: profile
      them: profile
    output: list of text
    examples:
      - given:
          me: {name: Alex, college: Pomona, class_year: 2027, major: CS, interests: [hiking, film, Frary brunch], open_to_all_campuses: true}
          them: {name: Sam, college: Scripps, class_year: 2026, major: Media Studies, interests: [film, Frary brunch, pottery], open_to_all_campuses: true}
        returns: [film, Frary brunch]

  - name: compatibility_score
    does: Score compatibility from 0 to 100, with a bonus for cross-campus matches.
    input:
      me: profile
      them: profile
    output: whole number


  - name: should_match
    does: Decide whether to show two students to each other, respecting cross-campus preferences.
    input:
      me: profile
      candidate: profile
    output: yes/no
