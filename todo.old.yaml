project: Todo list
overview: |
  A simple todo tracker. Tasks have a title and whether they're done.

nouns:
  task:
    title: text
    done: yes/no

functions:
  - name: count_open
    does: Count how many tasks are not yet done
    input:
      tasks: list of task
    output: whole number
    examples:
      - given:
          tasks:
            - { title: Laundry, done: no }
            - { title: Dishes, done: yes }
        returns: 1

  - name: all_titles
    does: Return the titles of every task
    input:
      tasks: list of task
    output: list of text
    examples:
      - given:
          tasks:
            - { title: Laundry, done: no }
            - { title: Dishes, done: yes }
        returns: [Laundry, Dishes]
